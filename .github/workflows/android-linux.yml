name: REA Android Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create synthetic Android APK with SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$SDK_TOOLS/d8" && test -x "$SDK_TOOLS/aapt"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/classes build/dex
          javac -d build/classes fixtures/LeadScore.java
          "$SDK_TOOLS/d8" --min-api 24 --output build/dex build/classes/org/example/hermeslab/LeadScore.class
          "$SDK_TOOLS/aapt" package -f -M fixtures/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-35/android.jar" -F sample.apk
          zip -j sample.apk build/dex/classes.dex
          unzip -l sample.apk | grep -E 'AndroidManifest.xml|classes.dex'
          sha256sum sample.apk
      - name: Download verified JADX headless 0.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            'https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar' \
            -o "$RUNNER_TEMP/jadx-headless-mcp-0.7.1-all.jar"
          echo '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  '"$RUNNER_TEMP/jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"
      - name: Prepare REA 5.0.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --no-save --ignore-scripts --no-audit --no-fund rea-agents@5.0.0
          echo "REA_CLI=$RUNNER_TEMP/rea/node_modules/rea-agents/scripts/rea.mjs" >> "$GITHUB_ENV"
      - name: Inspect Android APK and class
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s node "$REA_CLI" inspect-android-package "$GITHUB_WORKSPACE/sample.apk" --format json > android.json
          timeout 150s node "$REA_CLI" search-android-classes "$GITHUB_WORKSPACE/sample.apk" LeadScore --format json > classes.json
          python3 scripts/verify_android.py
