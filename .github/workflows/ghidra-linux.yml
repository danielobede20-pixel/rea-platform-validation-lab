name: REA Ghidra Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-elf-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Fetch synthetic fixture
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile owned ELF fixture
        run: |
          gcc -O0 -g -fno-inline -o sample.elf fixtures/sample.c
          ./sample.elf
          sha256sum sample.elf
      - name: Install official Ghidra 12.1.4 (verified digest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 250 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  '"$RUNNER_TEMP/ghidra.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR=$(find "$RUNNER_TEMP/ghidra" -maxdepth 1 -type d -name 'ghidra_12.1.4_PUBLIC*' | head -n 1)
          test -n "$GHIDRA_DIR" && test -f "$GHIDRA_DIR/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          echo "Ghidra installed in isolated runner"
      - name: Install local REA 5.0.0 (no install scripts)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --no-save --ignore-scripts --no-audit --no-fund rea-agents@5.0.0
          echo "REA_CLI=$RUNNER_TEMP/rea/node_modules/rea-agents/scripts/rea.mjs" >> "$GITHUB_ENV"
      - name: Check Ghidra compatibility
        shell: bash
        run: |
          set -euo pipefail
          node "$REA_CLI" doctor --provider ghidra --json > doctor.json
          python3 -c 'import json; d=json.load(open("doctor.json")); print("Ghidra ready:",d.get("healthy")); assert d.get("healthy") is True'
      - name: Analyze ELF (native Ghidra provider)
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node "$REA_CLI" analyze "$GITHUB_WORKSPACE/sample.elf" --provider ghidra --format json > native.json
          REA_DOCTOR_REPORT=doctor.json REA_NATIVE_REPORT=native.json python3 scripts/verify_native.py
      - name: Print non-sensitive final result
        if: always()
        shell: bash
        run: |
          if test -f lab-result.json; then cat lab-result.json; fi
